# =====================================================================
# 供應商交期回覆智能解析與影響評估工具 — 參數設定
#
# 設計原則：所有領域判斷都外部化到這個檔案，不寫死在程式裡。
#   理由：內部工具的第一版一定會被使用者挑戰「你憑什麼這樣排」。
#   把權重放在設定檔（且 UI 上可即時調整），同仁才能參與調校，
#   工具才活得下去。這是導入面的設計，不是技術面的設計。
# =====================================================================

# ---------------------------------------------------------------------
# 資料來源
# ---------------------------------------------------------------------
#   csv     讀 data/*.csv。欄位是預先算好的扁平資料，展示方便，
#           但不是 ERP 實際的樣貌。
#   sqlite  讀 data/erp_sim.db（模擬 ERP）。承諾日、改期次數、
#           有無二源等欄位必須用 SQL JOIN 從多張表推導出來 ——
#           這才是真正接 ERP 時會遇到的樣子。
#
# 真要接公司 ERP 時，只需在 src/adapters/ 新增一個 DataSource 子類別，
# 規則、評分、介面完全不用動。欄位對應見 docs/ERP欄位對應.md。
data_source: sqlite

# ---------------------------------------------------------------------
# 影響評估規則：10 條規則的權重（總和不必為 100，程式會自動正規化）
# 每條規則獨立產生 0.0~1.0 的分數，加權平均後 ×100 得到影響分數。
# ---------------------------------------------------------------------
impact_weights:
  buffer_days:          25   # 1. 緩衝天數：新ETA距下游需求日還剩幾天
  delay_magnitude:      10   # 2. 延遲幅度：比原承諾晚幾天
  single_source:        12   # 3. 單一來源：有無已認證二源
  downstream_scheduled: 15   # 4. 下游已排定：是否已排入封測或已對客戶承諾
  material_criticality:  8   # 5. 料的關鍵性：瓶頸料 / 長 LT 料
  commitment_strength:  10   # 6. 承諾強度：確認 / 暫估 / 僅表達意向
  reschedule_count:      6   # 7. 累犯：同一張 PO 已改期幾次
  delay_share:           6   # 8. 延遲量佔該料號當期需求比例
  notice_lead_time:      5   # 9. 通知時機：距原承諾日剩幾天才通知
  substitutability:      3   # 10. 可替代性：有無替代料

# 影響分數 -> 優先級分級門檻
priority_thresholds:
  P1: 70    # 今天一定要處理
  P2: 45    # 本週要追
  # 其餘為 P3：留意即可

# ---------------------------------------------------------------------
# 分層解析：規則層信心分數低於此門檻時，才升級呼叫 LLM
# 調高 -> 更多信件走 LLM，準度高但成本高
# 調低 -> 省成本，但漏抽風險上升
# ---------------------------------------------------------------------
extraction:
  confidence_threshold: 0.75
  # 承諾強度為以下值時，一律不覆寫系統承諾日，強制人工確認
  require_human_review_when:
    - estimated
    - intent_only
  # 解析出的新日期比原承諾早於此天數時視為可疑，強制人工確認
  suspicious_if_earlier_than_days: 0

# ---------------------------------------------------------------------
# 效益量化參數（全部可調；README 會附敏感度分析）
# 這些是「假設」不是「事實」，數值請依實際單位調整後再對外引用。
# ---------------------------------------------------------------------
benefit:
  manual_seconds_per_email: 180      # 人工讀一封回覆信、查ERP、判斷影響的估計秒數
  tool_seconds_per_action: 45        # 使用工具後，處理一個行動項的估計秒數
  daily_review_capacity: 20          # 生管一天實際能仔細追的案件數（Top-K 的 K）
  workdays_per_month: 21

# ---------------------------------------------------------------------
# 合成資料產生器參數
# ---------------------------------------------------------------------
data_generation:
  seed: 20260908
  n_suppliers: 12
  n_materials: 40
  n_purchase_orders: 260
  n_generated_emails: 42        # 程式產生的信件數（另有手寫的刁鑽案例）
  as_of_date: "2026-09-08"      # 模擬「今天」
